[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testomatic-io"
version = "0.1.0"
description = "Hardware abstraction layer for the I/O features of the Testomatic chassis and test modules"
readme = "README.md"
authors = [{name = "Jonathan Oxer", email = "jon@oxer.com.au"}]
requires-python = ">=3.11"
dependencies = [
    "adafruit-blinka",
    # 0.2.0+ accepts an injectable I2C transport (i2c_bus=), so it can be
    # routed through the TCA9548A mux's per-channel addressing; 0.3.0 adds
    # pin_mode(). See testomatic_io/iomod/drivers/ad5593r.py.
    "ad5593r>=0.3.0",
    "adafruit-circuitpython-tca9548a>=0.8.6",
    "adafruit-circuitpython-ina260",
    "adafruit-circuitpython-24lc32",
]

[project.urls]
Homepage = "https://github.com/SuperHouse/testomatic-io"

[tool.setuptools.packages.find]
include = ["testomatic_io*"]
