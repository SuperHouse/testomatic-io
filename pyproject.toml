[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testomatic-io"
version = "0.1.0"
description = "Hardware abstraction layer for the I/O features of the Testomatic chassis and test modules"
readme = "README.md"
authors = [{name = "Jonathan Oxer", email = "jon@oxer.com.au"}]
requires-python = ">=3.11"
dependencies = [
    "adafruit-blinka",
    # Modern Linux GPIO character-device API, used instead of Blinka's
    # digitalio for the fixed relay/button/beeper/interrupt pins -- works
    # identically across Pi 3/4/5 with no board-specific backend (unlike
    # digitalio, which needs RPi.GPIO on Pi 4 and `lgpio` on Pi 5). See
    # testomatic_io/gpio.py. 2.0.2 is the first release of the current
    # (v2) API this code uses.
    "gpiod>=2.0.2",
    # 0.2.0+ accepts an injectable I2C transport (i2c_bus=), so it can be
    # routed through the TCA9548A mux's per-channel addressing; 0.3.0 adds
    # pin_mode(). See testomatic_io/iomod/drivers/ad5593r.py.
    "ad5593r>=0.3.0",
    # Sibling library to ad5593r, same injectable-transport design. See
    # testomatic_io/iomod/drivers/mcp23008.py.
    "mcp23008>=0.1.0",
    # Third sibling library, same injectable-transport design -- its
    # channel objects (tca[n]) natively expose the same readfrom/writeto/
    # scan shape ad5593r/mcp23008 need, so no adapter is required between
    # the mux and downstream drivers. See testomatic_io/iomod/manager.py's
    # BlinkaI2CAdapter, which wraps the upstream Blinka bus once instead.
    "tca9548a>=0.1.0",
    "adafruit-circuitpython-ina260",
    "adafruit-circuitpython-24lc32",
]

[project.optional-dependencies]
# Lets the whole package import (against tests/conftest.py's hardware
# stubs) and run on a machine with no real Raspberry Pi.
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/SuperHouse/testomatic-io"

[tool.setuptools.packages.find]
include = ["testomatic_io*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the repo root on sys.path during test collection so `import
# testomatic_io` works whether or not the package is installed.
pythonpath = ["."]
